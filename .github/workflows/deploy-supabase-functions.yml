name: Deploy SIM-LSP Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simlsp-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.SUPABASE_FUNCTIONS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: lcfqhrziveksvxuldsfa
    steps:
      - name: Check out function source
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment settings
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Set the SUPABASE_ACCESS_TOKEN repository secret before enabling deployment." >&2
            exit 1
          fi
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
