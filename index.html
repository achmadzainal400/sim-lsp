function emptySharedDb(){return {reports:[],assets:[],assetTransactions:[],assetReportExclusions:[],sopHtml:"",sopSourceName:"",sopUpdatedAt:""};}
function normalizeDbData(value){let d=value&&typeof value==="object"&&!Array.isArray(value)?value:{};d.reports=Array.isArray(d.reports)?d.reports.filter(function(r){return r&&typeof r==="object"&&!Array.isArray(r);}):[];d.reports.forEach(function(r){delete r.source;delete r.sourceDetail;if(!Array.isArray(r.events))r.events=[];});d.assets=Array.isArray(d.assets)?d.assets.filter(function(a){return a&&typeof a==="object"&&!Array.isArray(a);}):[];d.assets.forEach(function(a){if(typeof a.acquisitionDate!=="string")a.acquisitionDate="";a.status=assetStatus(a.status);if(typeof a.description!=="string")a.description="";});d.assetTransactions=Array.isArray(d.assetTransactions)?d.assetTransactions.filter(function(t){return t&&typeof t==="object"&&!Array.isArray(t);}):[];d.assetReportExclusions=Array.isArray(d.assetReportExclusions)?d.assetReportExclusions:[];if(typeof d.sopHtml!=="string")d.sopHtml="";if(typeof d.sopSourceName!=="string")d.sopSourceName="";if(typeof d.sopUpdatedAt!=="string")d.sopUpdatedAt="";return d;}
function loadDb(){try{const raw=localStorage.getItem(STORE_KEY);return raw?normalizeDbData(JSON.parse(raw)):emptySharedDb();}catch(e){return emptySharedDb();}}
function saveLocalDb(){try{localStorage.setItem(STORE_KEY,JSON.stringify(db));return true;}catch(e){toast("Penyimpanan browser penuh. Ekspor cadangan atau kurangi lampiran.");return false;}}
function saveDb(){if(!saveLocalDb())return false;if(sharedDataReady&&isManager())queueSharedDataSave();return true;}
function stableStringify(value){if(Array.isArray(value))return "["+value.map(stableStringify).join(",")+"]";if(value&&typeof value==="object")return "{"+Object.keys(value).sort().map(function(key){return JSON.stringify(key)+":"+stableStringify(value[key]);}).join(",")+"}";return JSON.stringify(value);}
function cloneSharedDb(value){return normalizeDbData(JSON.parse(JSON.stringify(value||emptySharedDb())));}
function sameSharedValue(a,b){return stableStringify(a)===stableStringify(b);}
function sharedHasData(value){let data=value||emptySharedDb();return !!((data.reports||[]).length||(data.assets||[]).length||(data.assetTransactions||[]).length||(data.sopHtml||""));}
function readSharedBase(){try{let raw=localStorage.getItem(SHARED_BASE_KEY);return raw?normalizeDbData(JSON.parse(raw)):null;}catch(e){return null;}}
function writeSharedBase(value){try{localStorage.setItem(SHARED_BASE_KEY,JSON.stringify(normalizeDbData(cloneSharedDb(value))));}catch(e){}}
function setSharedStatus(state,message){sharedSyncStatus=state;sharedStatusMessage=message||"";let el=document.getElementById("syncState");if(el){let labels={local:"Lokal",pending:"Menyinkronkan",synced:"Tersinkron",error:"Belum sinkron",conflict:"Perlu muat ulang"},label=labels[state]||"Status data";el.textContent=label;el.dataset.state=state;el.title=sharedStatusMessage;el.setAttribute("aria-label","Status sinkronisasi: "+label+(sharedStatusMessage?". "+sharedStatusMessage:"."));}let note=document.getElementById("dataStorageNote");if(note)note.textContent=sharedDataReady?"Data laporan dan aset dibagikan melalui Supabase.":"Data tersimpan di perangkat ini sampai SQL sinkronisasi dijalankan.";}
function mergeSharedArray(base,local,remote,key,label,conflicts){let bm=new Map((base||[]).map(function(x){return [String(x&&x[key]||""),x];})),lm=new Map((local||[]).map(function(x){return [String(x&&x[key]||""),x];})),rm=new Map((remote||[]).map(function(x){return [String(x&&x[key]||""),x];})),order=[];[remote||[],local||[],base||[]].forEach(function(list){list.forEach(function(x){let id=String(x&&x[key]||"");if(id&&!order.includes(id))order.push(id);});});let result=[];order.forEach(function(id){let b=bm.get(id),l=lm.get(id),r=rm.get(id),lc=!sameSharedValue(l,b),rc=!sameSharedValue(r,b),chosen;if(!lc)chosen=r;else if(!rc||sameSharedValue(l,r))chosen=l;else{chosen=r;conflicts.push(label+" "+id);}if(chosen!==undefined)result.push(chosen);});return result;}
function mergeSharedDb(base,local,remote){let conflicts=[],b=base||emptySharedDb(),l=local||emptySharedDb(),r=remote||emptySharedDb(),merged={reports:mergeSharedArray(b.reports,l.reports,r.reports,"id","Laporan",conflicts),assets:mergeSharedArray(b.assets,l.assets,r.assets,"id","Aset",conflicts),assetTransactions:mergeSharedArray(b.assetTransactions,l.assetTransactions,r.assetTransactions,"id","Transaksi",conflicts),assetReportExclusions:[]};let ids=new Set([...(b.assetReportExclusions||[]),...(l.assetReportExclusions||[]),...(r.assetReportExclusions||[])].map(String));ids.forEach(function(id){let bv=(b.assetReportExclusions||[]).map(String).includes(id),lv=(l.assetReportExclusions||[]).map(String).includes(id),rv=(r.assetReportExclusions||[]).map(String).includes(id),lc=lv!==bv,rc=rv!==bv,keep=!lc?rv:(!rc||lv===rv?lv:rv);if(keep)merged.assetReportExclusions.push(id);});["sopHtml","sopSourceName","sopUpdatedAt"].forEach(function(key){let lc=!sameSharedValue(l[key]||"",b[key]||""),rc=!sameSharedValue(r[key]||"",b[key]||"");merged[key]=!lc?(r[key]||""):(!rc||sameSharedValue(l[key]||"",r[key]||"")?(l[key]||""):(conflicts.push("SOP"),r[key]||""));});return {data:normalizeDbData(merged),conflicts:conflicts};}
async function fetchSharedData(){if(!supabaseClient)throw new Error("Supabase belum tersambung.");let result=await supabaseClient.rpc("simlsp_get_shared_state");if(result.error)throw result.error;if(!result.data||typeof result.data!=="object"||!result.data.data)throw new Error("Data bersama belum tersedia. Jalankan SQL sinkronisasi SIM-LSP.");return {revision:Number(result.data.revision||0),data:normalizeDbData(result.data.data)};}
async function syncAdminSharedData(data,revision){return supabaseClient.rpc("simlsp_save_shared_state",{p_data:data,p_expected_revision:revision});}
function queueSharedDataSave(){sharedSyncQueued=true;setSharedStatus("pending","Perubahan tersimpan di perangkat ini dan sedang dikirim ke Supabase.");clearTimeout(sharedSyncTimer);sharedSyncTimer=setTimeout(syncSharedData,350);}
async function syncSharedData(){if(!sharedDataReady||!isManager()||!supabaseClient||sharedSyncBusy)return;sharedSyncBusy=true;let passes=0;while(sharedSyncQueued&&passes<2){sharedSyncQueued=false;passes++;let snapshot=cloneSharedDb(db),result=await syncAdminSharedData(snapshot,sharedRevision);if(!result.error){sharedRevision=Number(result.data&&result.data.revision||result.data||sharedRevision+1);writeSharedBase(snapshot);if(sharedRecoveryPending){try{localStorage.removeItem(SHARED_BACKUP_KEY);}catch(e){}sharedRecoveryPending=false;}setSharedStatus("synced","Data bersama berhasil diperbarui.");continue;}if(result.error.code==="40001"){try{let latest=await fetchSharedData(),base=readSharedBase()||emptySharedDb(),merged=mergeSharedDb(base,snapshot,latest.data);if(merged.conflicts.length){localStorage.setItem(SHARED_BACKUP_KEY,JSON.stringify(snapshot));sharedRecoveryPending=false;setSharedStatus("conflict","Ada perubahan bersamaan pada data yang sama. Unduh cadangan data perangkat ini sebelum memuat ulang.");break;}db=merged.data;saveLocalDb();sharedRevision=latest.revision;writeSharedBase(latest.data);render();if(openReportId&&getReport(openReportId))openDetail(openReportId);if(!sameSharedValue(db,latest.data)){sharedSyncQueued=true;continue;}if(sharedRecoveryPending){try{localStorage.removeItem(SHARED_BACKUP_KEY);}catch(e){}sharedRecoveryPending=false;}setSharedStatus("synced","Data bersama berhasil dimuat ulang.");}catch(error){setSharedStatus("error","Konflik sinkronisasi. Data perangkat tetap tersimpan; muat ulang data bersama setelah memeriksa cadangan.");}break;}setSharedStatus("error","Data perangkat masih tersimpan, tetapi belum masuk ke Supabase. "+(result.error.message||"Periksa SQL sinkronisasi dan koneksi."));break;}sharedSyncBusy=false;if(sharedSyncQueued)sharedSyncTimer=setTimeout(syncSharedData,0);}
function startSharedPolling(){clearInterval(sharedPollTimer);if(sharedDataReady)sharedPollTimer=setInterval(function(){let active=document.activeElement;if(document.visibilityState!=="hidden"&&!(active&&active.closest&&active.closest("form")))refreshSharedData(true);},60000);}
async function connectSharedData(){
  sharedDataReady=false;clearTimeout(sharedSyncTimer);clearInterval(sharedPollTimer);setSharedStatus("pending","Menghubungkan data laporan dan aset ke Supabase.");
  let local=cloneSharedDb(db),recovered=null,recoveredConflicts=false;
  if(isManager()){try{let saved=localStorage.getItem(SHARED_BACKUP_KEY);if(saved)recovered=normalizeDbData(JSON.parse(saved));}catch(e){}}
  try{
    let remote=await fetchSharedData(),base=readSharedBase()||emptySharedDb();
    if(isManager()&&recovered&&sharedHasData(recovered)){
      let recoveryMerge=mergeSharedDb(base,recovered,local);local=recoveryMerge.data;recoveredConflicts=recoveryMerge.conflicts.length>0;sharedRecoveryPending=!recoveredConflicts;
    }
    if(remote.revision===0&&!sharedHasData(remote.data)&&isManager()&&sharedHasData(local)){
      let seed=await syncAdminSharedData(local,0);if(seed.error)throw seed.error;remote.revision=Number(seed.data&&seed.data.revision||seed.data||1);remote.data=local;writeSharedBase(remote.data);db=local;saveLocalDb();sharedRevision=remote.revision;sharedDataReady=true;if(sharedRecoveryPending){try{localStorage.removeItem(SHARED_BACKUP_KEY);}catch(e){}sharedRecoveryPending=false;}setSharedStatus("synced","Data lokal perangkat admin awal berhasil disalin ke Supabase.");startSharedPolling();return true;
    }
    if(isManager()){
      let merged=mergeSharedDb(base,local,remote.data);
      if(merged.conflicts.length||recoveredConflicts){try{localStorage.setItem(SHARED_BACKUP_KEY,JSON.stringify(recoveredConflicts?recovered:local));}catch(e){}sharedRecoveryPending=false;setSharedStatus("conflict","Sebagian data perangkat berbeda dengan data bersama. Cadangan lokal disimpan sebelum penggabungan.");}
      db=merged.data;saveLocalDb();sharedRevision=remote.revision;writeSharedBase(remote.data);sharedDataReady=true;
      if(!sameSharedValue(db,remote.data))queueSharedDataSave();else if(!merged.conflicts.length&&!recoveredConflicts){if(sharedRecoveryPending){try{localStorage.removeItem(SHARED_BACKUP_KEY);}catch(e){}sharedRecoveryPending=false;}setSharedStatus("synced","Data laporan dan aset bersama berhasil dimuat.");}else if(recoveredConflicts)setSharedStatus("conflict","Cadangan lokal memiliki perubahan yang bertabrakan. Cadangan tetap disimpan sebelum penggabungan.");
    }else{
      if(sharedHasData(local)&&!sameSharedValue(local,remote.data)){try{localStorage.setItem(SHARED_BACKUP_KEY,JSON.stringify(local));}catch(e){}}
      db=remote.data;saveLocalDb();sharedRevision=remote.revision;writeSharedBase(remote.data);sharedDataReady=true;
      setSharedStatus("synced",remote.revision===0&&!sharedHasData(remote.data)&&sharedHasData(local)?"Data lama tersimpan sebagai cadangan lokal. Sarpras/Admin perlu masuk untuk membagikannya ke semua akun.":"Data laporan dan aset bersama berhasil dimuat.");
    }
    startSharedPolling();return true;
